<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Account</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-body">
<div class="auth-card wide">
    <div class="brand">Bank<span>Ease</span></div>
    <h1>Create Customer Account</h1>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>

    <form method="post" action="/register" th:object="${user}">
        <label>Full Name</label>
        <input type="text" th:field="*{fullName}" required>

        <label>Username</label>
        <input type="text" th:field="*{username}" required>

        <label>Email</label>
        <input type="email" th:field="*{email}" required>

        <label>Phone</label>
        <input type="text" th:field="*{phone}" maxlength="15">

        <label>Password</label>
        <input type="password" th:field="*{password}" minlength="6" required>

        <button class="btn primary full">Register</button>
    </form>
    <p class="center">Already registered? <a href="/login">Login</a></p>
</div>
</body>
</html>
