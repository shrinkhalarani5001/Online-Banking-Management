<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Transfer Money</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar">
    <div class="brand">Bank<span>Ease</span></div>
    <div>
        <a href="/dashboard">Dashboard</a>
        <a href="/transfer">Transfer</a>
        <a href="/profile">Profile</a>
        <a href="/logout" class="logout">Logout</a>
    </div>
</nav>
<main class="container narrow">
    <div class="panel">
        <h1>Transfer Money</h1>
        <p class="muted">Send money securely to another BankEase account.</p>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <form method="post" action="/transfer">
            <label>Receiver Account Number</label>
            <input type="text" name="receiverAccount" placeholder="Enter account number" required>

            <label>Amount</label>
            <input type="number" name="amount" min="1" step="0.01" placeholder="₹ Amount" required>

            <button class="btn primary full">Transfer Money</button>
        </form>
        <br>
        <a href="/dashboard">← Back to Dashboard</a>
    </div>
</main>
</body>
</html>
